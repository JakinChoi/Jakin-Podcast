<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jakin's Podcast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--brand:#12261F;--char:#24463A;--lav:#EEE9DA;--gold:#A4863D;--black:#1B382E;--ink:#EEE9DA;--mute:#B7C7BC;--line:rgba(238,233,218,.14);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--black);color:var(--ink);font:300 17px/1.8 "Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Noto Serif KR",Georgia,serif;font-weight:400;line-height:1.4;margin:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #EEE9DA;outline-offset:3px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(18,38,31,.62);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.bar{max-width:1120px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{font-family:"Noto Serif KR",Georgia,serif;font-size:15px;letter-spacing:.02em}
nav{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
nav a{font-size:13px;color:var(--mute);padding:4px 0;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
nav a:hover{color:var(--ink)}nav a.on{color:var(--ink);border-color:var(--gold)}
.lang{background:none;border:1px solid var(--line);color:var(--mute);border-radius:20px;padding:4px 14px;font:inherit;font-size:13px;cursor:pointer}
.lang:hover{color:var(--ink);border-color:var(--mute)}
main{min-height:70vh}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.narrow{max-width:680px;margin:0 auto;padding:0 24px}
.photo{background:linear-gradient(160deg,#2f5946,var(--char) 50%,var(--black) 100%);display:flex;align-items:center;justify-content:center;color:rgba(238,233,218,.5);font-size:14px;text-align:center;padding:20px}
.hero{position:relative;min-height:calc(100svh - 70px);display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.hero .photo{position:absolute;inset:0;align-items:flex-end;justify-content:center}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(18,38,31,.08),rgba(18,38,31,.45))}
.hero .txt{position:relative;z-index:2;padding:56px 52px;margin:96px 24px;max-width:760px;background:rgba(10,22,18,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);text-shadow:0 2px 24px rgba(0,0,0,.4);animation:rise 1.1s ease both}
.hero h1{font-size:clamp(28px,4.4vw,44px);margin-bottom:24px}
.hero p{margin:0;line-height:2;color:#D6E0D8;font-size:clamp(16px,2.2vw,19px)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hero .txt{animation:none}*{transition:none!important}}
.intro{padding:112px 0;background:var(--brand)}.split{display:grid;grid-template-columns:1fr .75fr;gap:72px;align-items:center}.split .photo{aspect-ratio:3/4;border:1px solid var(--line)}
.intro p{font-family:"Noto Serif KR",Georgia,serif;font-size:clamp(15px,1.8vw,17px);line-height:2;margin:0 0 24px;color:#D3DED6}
.intro p:last-child{margin:0}
.section{padding:96px 0}
.section h2{font-size:clamp(26px,4vw,36px);margin-bottom:36px}
.card{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center;border:1px solid var(--line);background:var(--char);transition:border-color .2s}
.card:hover{border-color:var(--gold)}
.card .photo{aspect-ratio:16/9;min-height:100%}
.card .info{padding:40px 40px 40px 0}
.date{color:var(--mute);font-size:14px;margin-bottom:10px}
.card h3{font-size:clamp(22px,3vw,28px);margin-bottom:14px}
.card p{color:var(--mute);margin:0}
.page-head{padding:96px 0 48px;border-bottom:1px solid var(--line)}
.page-head h1{font-size:clamp(32px,5vw,48px)}
.search{margin-top:32px;width:100%;max-width:420px;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;padding:10px 0}
.search::placeholder{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:40px 32px;padding:56px 0 96px}
.ep .photo{aspect-ratio:16/9;margin-bottom:18px;border:1px solid var(--line);transition:border-color .2s}
.ep:hover .photo{border-color:var(--gold)}
.ep h3{font-size:20px;margin-bottom:6px}
.ep p{margin:0;color:var(--mute);font-size:15px}
.empty{color:var(--mute);padding:56px 0 96px}
.back{display:inline-block;margin:48px 0 28px;color:var(--mute);font-size:15px}
.back:hover{color:var(--ink)}
.video{aspect-ratio:16/9;background:#000;border:1px solid var(--line)}
.video iframe{width:100%;height:100%;border:0;display:block}
.video .photo{height:100%}
.ytlink{display:inline-block;margin-top:14px;color:var(--mute);font-size:14px;border-bottom:1px solid var(--line)}
.ep-body{padding:40px 0 96px;max-width:720px}
.ep-body h1{font-size:clamp(26px,4vw,38px);margin:6px 0 32px}
.ep-body h2{font-size:22px;margin:48px 0 14px;padding-top:32px;border-top:1px solid var(--line)}
.ep-body p{color:#C5D3C9}
.about{display:grid;justify-items:center;padding:96px 24px}.about.narrow{max-width:972px}
.about .portrait{width:100%;max-width:960px;aspect-ratio:16/9;margin-bottom:56px;border:1px solid var(--line)}.atext{width:100%;max-width:924px}.about-top{display:flex;justify-content:center;padding:72px 24px 0}.about-top .photo{width:min(924px,100%);aspect-ratio:16/9;border:1px solid var(--line)}
.about h1{font-size:clamp(30px,5vw,44px);margin-bottom:28px;text-align:center}
.about p{color:#C5D3C9;margin:0 0 24px}
.contact{padding:96px 24px}
.contact h1{font-size:clamp(32px,5vw,48px);margin-bottom:28px}
.contact p{color:var(--mute);margin:0 0 32px}
.mail{font-family:"Noto Serif KR",Georgia,serif;font-size:clamp(20px,3.4vw,30px);border-bottom:1px solid var(--gold);padding-bottom:4px}
footer{background:var(--brand)}
.foot{max-width:1120px;margin:0 auto;padding:56px 24px 40px;display:flex;justify-content:space-between;gap:32px;flex-wrap:wrap}
.foot nav a,.foot .soc a{color:var(--lav)}
.foot .soc{display:flex;gap:22px;align-items:center}.foot .soc svg{width:22px;height:22px;display:block}
.foot .soc a:hover{color:var(--lav)}
.copy{max-width:1120px;margin:0 auto;padding:0 24px 40px;color:rgba(238,233,218,.5);font-size:13px}
@media(max-width:760px){.hero .txt{padding:36px 24px;margin:80px 16px}.about-top .photo{aspect-ratio:4/5}.split{grid-template-columns:1fr;gap:40px}.card{grid-template-columns:1fr;gap:0}.card .info{padding:28px}.intro,.section{padding:72px 0}.about,.contact{padding:72px 24px}nav{gap:18px}}

var T={
 home:["홈","Home"],pod:["팟캐스트","Podcasts"],about:["소개","About"],contact:["문의","Contact"],
 h1:["안녕하세요, Jakin입니다.","Hello, I'm Jakin."],
 h2:["매주 화요일, 새로운 에피소드를 올립니다.","A new episode every Tuesday."],
 h3:["창업, 비즈니스, 심리, 종교, 철학, 정치.<br>각 분야의 경험자와 전문가들의 이야기를 들어보세요.","Startups, business, psychology, religion, philosophy, politics.<br>Hear the stories of people who have lived it and the experts who study it."],
 ph:["팟캐스트 룸 사진을 여기에 넣습니다","Podcast room photo goes here"],
 i1:["세상에는 정말 다양한 사람들이 살고 있습니다. 그래서 주제도, 관심사도, 취미도, 교육도, 직업도, 지식도 끝이 없습니다.","The world is full of different people, and so there is no end to topics, interests, hobbies, education, professions and knowledge."],
 i2:["우리의 삶은 그 방대한 지식과 선택지에 비하면 너무나 짧습니다. 하지만 그렇다고 해서 여러 분야의 사람들을 보고, 듣고, 배울 수 없는 것은 아닙니다.","Our lives are short compared to all there is to know. But that doesn't mean we can't see, hear and learn from people in many different fields."],
 i3:["한 사람 한 사람을 깊이 들여다보면, 저마다의 이야기와 세계관이 있고, 그 안에는 배우고 알아갈 기회가 있다고 믿습니다.","Look closely at any one person and you find their own story and worldview, and something to learn from it. That is what I believe."],
 iph:["사진을 여기에 넣습니다","Photo goes here"],latest:["최신 에피소드","Latest episode"],soonEp:["첫 에피소드를 곧 공개합니다. 매주 화요일에 만나요.","The first episode is coming soon. See you on Tuesdays."],
 all:["모든 에피소드","All episodes"],search:["에피소드 또는 게스트 검색","Search episodes or guests"],
 none:["검색 결과가 없습니다. 다른 단어로 찾아보세요.","No episodes found. Try a different search."],
 back:["모든 에피소드로 돌아가기","Back to all episodes"],
 soon:["영상 준비 중","Video coming soon"],yt:["YouTube에서 보기","Watch on YouTube"],
 about_t:["Jakin을 소개합니다","About Jakin"],
 about_p1:["저는 사람들의 이야기를 듣는 것을 좋아하는 Jakin입니다. 이 팟캐스트는 다양한 분야의 경험자와 전문가를 만나, 그들의 생각과 삶을 깊이 있게 나누기 위해 시작했습니다.","I'm Jakin, and I love listening to people's stories. I started this podcast to sit down with people of many backgrounds and explore how they think and live."],
 about_p2:["자세한 소개는 곧 업데이트됩니다.","A fuller introduction is coming soon."],
 aph:["Jakin 사진을 여기에 넣습니다","Photo of Jakin goes here"],

};

function t(k){return T[k][lang==="ko"?0:1]}

function tile(label){return '<div class="photo">'+label+'</div>'}

 return h.map(function(x){var on=(x[0]==="#/"?r==="home":r===x[1]||(x[1]==="pod"&&r==="ep"))?' class="on"':"";return '<a href="'+x[0]+'"'+on+'>'+t(x[1])+'</a>'}).join("")}
function epCard(e){return '<a class="ep" href="#/podcasts/'+e.id+'">'+tile(fmt(e.date))+'<h3>'+L(e).t+'</h3><p>'+e.guest+'</p></a>'}
function home(){var e=EPISODES[0];var lat=e?'<a class="card" href="#/podcasts/'+e.id+'">'+tile(fmt(e.date))+'<div class="info"><div class="date">'+fmt(e.date)+'</div><h3>'+L(e).t+'</h3><p>'+e.guest+'</p></div></a>':'<p class="empty" style="padding:0">'+t("soonEp")+'</p>';
 return '<section class="hero"><div class="photo img-hero" role="img" aria-label="Podcast studio"></div><div class="txt"><h1>'+t("h1")+'</h1><p>'+t("h2")+'</p><p>'+t("h3")+'</p></div></section>'+
 '<section class="intro"><div class="wrap split"><div><p>'+t("i1")+'</p><p>'+t("i2")+'</p><p>'+t("i3")+'</p></div><div class="photo img-split" role="img" aria-label="Jakin"></div></div></section>'+
 '<section class="section"><div class="wrap"><h2>'+t("latest")+'</h2>'+lat+'</div></section>'}
function podcasts(q){q=(q||"").toLowerCase();
 var list=EPISODES.filter(function(e){return (L(e).t+e.guest+L(e).d).toLowerCase().indexOf(q)>-1});
 return '<div class="page-head"><div class="wrap"><h1>'+t("all")+'</h1><input class="search" id="q" type="search" placeholder="'+t("search")+'" value="'+q+'" aria-label="'+t("search")+'"></div></div><div class="wrap" id="list">'+listHtml(list)+'</div>'}
function listHtml(list){return list.length?'<div class="grid">'+list.map(epCard).join("")+'</div>':'<p class="empty">'+(EPISODES.length?t("none"):t("soonEp"))+'</p>'}
function episode(id){var e=EPISODES.filter(function(x){return x.id===id})[0];if(!e)return podcasts();
 var v=e.yt?'<iframe src="https://www.youtube-nocookie.com/embed/'+e.yt+'" title="'+L(e).t+'" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>':tile(t("soon"));
 var link=e.yt?'<a class="ytlink" href="https://www.youtube.com/watch?v='+e.yt+'" target="_blank" rel="noopener">'+t("yt")+'</a>':"";
 return '<div class="wrap"><a class="back" href="#/podcasts">'+t("back")+'</a><div class="video">'+v+'</div>'+link+
 '<div class="ep-body"><div class="date">'+fmt(e.date)+'</div><h1>'+L(e).t+'</h1><h2 style="border:0;padding:0;margin-top:0">'+t("ep_desc")+'</h2><p>'+L(e).d+'</p><h2>'+t("ep_guest")+' · '+e.guest+'</h2><p>'+L(e).g+'</p></div></div>'}
var ABOUT={"ko": ["제가 어떤 사람인지 궁금하신 분들을 위해, 제 삶과 관심사, 그리고 팟캐스트를 시작한 이유를 간단히 소개해 볼게요. 편하게 읽어주세요.", "저는 한국에서 태어났지만, 인생 대부분을 한국에서 보내지는 않았어요. 아버지를 따라 네 살 때 몽골로 건너갔고, 아버지는 그곳에서 20년이 넘게 선교사로 사셨습니다. 자연스럽게 저도 어린 시절과 10대를 대부분 몽골에서 보냈어요.", "몽골 출신이라고 하면 다들 놀라세요. 그러고는 항상 말과 악뮤 얘기를 물어보시죠. 우선적으로 말씀드리면, 악뮤 멤버들과는 아무 관계도 없습니다. 이 얘기는 꼭 짚고 넘어가고 싶었어요. 대신 말은 정말 좋아하고, 꽤 잘 탑니다.", "어쨌든 저는 그곳에서 다섯 개 언어를 유창하게 말하게 되었고, 제 세계관과 신념 대부분도 그곳에서 만들어졌어요.", "제 삶에는 세 가지 “큰 관심사”와 열정이 있습니다. 하지만 꽤 오랫동안 저는 제 관심사가 무엇인지, 재능이 무엇인지조차 몰랐습니다.", "축구를 좋아했지만, 아버지께 물려받은 발목으로는 프로가 될 수 없었죠. 언젠가 찾게 될 “특별한 재능”을 늘 갈망했지만, 아무리 찾아도 보이지 않았어요. 대부분의 일을 그럭저럭 하는 편이긴 해도, 평생의 과업이나 소명이라고 말할 만큼은 아니라고 느꼈어요.", "그런데 인생이 그렇듯, 첫 번째 “큰 관심사”이자 어쩌면 “재능”을 뜻밖의 순간에 만나게 됩니다. 유통 회사에서 건축 현장 작업자로 일하던 때였어요. 마침 회사가 대규모 구조조정을 겪고 있었고, 핵심 인물들이 모이는 회의에 통역이 필요했고, 제가 어쩌다 통역사로 투입되었습니다. 그 회의들은 정말 길었어요. 하루 종일 이어졌죠. 그런데 놀랍게도 하나도 지루하지 않았습니다. 저는 비즈니스 세계에 완전히 빠져들었고, 그 세계가 저를 부르는 것 같았어요. “넌 나의 가장 열렬한 팬이야”라고 속삭이면서요. 회사의 주요 이해관계자들이 저를 눈여겨보기 시작했고, 그게 제 “비즈니스” 커리어와 관심의 시작이었습니다.", "그때부터 저는 비서, 마케팅 매니저부터 스타트업 창업(그리고 실패), 짧게나마 작은 회사의 CEO까지, 다양한 업계와 회사에서 일했어요. 이 모든 경험이 비즈니스에 대한 관심과 열정, 그리고 기업가의 세계를 이해하고 정복하고 싶다는 마음을 더 키워주었습니다.", "두 번째 “큰 관심사”는 코로나 한복판에서 시작됐어요. 그때 저는 바닥을 치고 있었습니다. 세상과 단절되었고, 삶의 방향을 잃었고, 우울했어요. 그러다 유튜브라는 멋진 세계를 만났습니다. 정말 대단한 세계였어요! 재능 있는 사람들과 그들의 관점, 세계관을 보면서 감탄이 끊이지 않았어요. 제가 직접 겪어보지 못한 삶의 또 다른 면을 열어주었죠. 특히 팟캐스트 분야가 제일 좋았어요. 조 로건, 크리스 윌리엄슨, 다이어리 오브 CEO, 바이블 프로젝트 팟캐스트 같은 채널을 즐겨 봤습니다. 그리고 보면 볼수록, 저에게도 세상과 나누고 싶은 저만의 작은 세계가 있다는 생각이 들었어요.", "그 관심사는 이상하게도 절대 사그라들지 않았어요. 제가 “운명”이라고 생각했던 대부분의 “관심사”는 몇 달을 넘기지 못했지만, 이건 달랐습니다. 계속 저를 부르며 뭐라도 해보라고 손짓했어요. 결국 카메라를 샀습니다. 소니 A7C였어요. 하지만 좋은 미러리스 카메라를 샀다고 유튜버가 되는 건 아니더라고요. 카메라를 산 지 몇 년이 지나, 수많은 실패한 시도 끝에야 비로소 모든 걸 걸고 이 팟캐스트를 시작하기로 했습니다. 제 평생의 꿈의 시작이었습니다.", "마지막이지만 결코 덜 중요하지 않은 “큰 관심사”는 기독교입니다. 제 신앙은 부모님께 물려받은 것이고, 그건 부인할 수 없습니다. 하지만 기독교에 대한 관심과 열정은 살아오는 내내 계속 자라났습니다. 저의 신앙은 오르막과 내리막, 그리고 다시 오르막을 겪었죠. 그래도 신앙은 저를 떠난 적이 없고, 지금은 그 어느 때보다 하나님을 알고 사랑과 희망의 메시지를 세상에 전하고 싶다는 마음이 간절합니다. 제 삶의 모든 것이 무너지고 불타 재가 되더라도, 끝까지 남아 있을 단 하나는 그리스도를 향한 제 믿음이라는 걸 알고 또 믿습니다.", "자, 여기까지가 제 이야기입니다. 지금까지는요. 그리고 계속됩니다..."], "en": ["For those curious about who I am, here’s a brief overview of my life, my interests, and my reasons for starting this podcast. Indulge me.", "Although I was born in Korea, it wasn’t where I spent most of my life. Following my dad’s footsteps, I moved to Mongolia at the age of four, where he served as a missionary for over 20 years. Naturally, I stayed there for most of my childhood and teenage years.", "People are always surprised when I tell them I’m from Mongolia. Horses and AKMU are the two things I get asked about, and no, I have no connection to the AKMU members whatsoever. Just wanted to clear that up. I do love horses, though, and I ride quite well.", "Anyway, that’s where I learned to speak five languages fluently, and where most of my worldview and beliefs were formed.", "There are three “major interests” and passions in my life. But for a long time, I had no idea what my interests were, let alone what my talents were.", "I loved playing soccer, but with the ankles I inherited from my dad, I wasn’t going pro with that gift. I longed for a special talent that I’d someday find, but I just couldn’t find one. I felt like I was okay at most things, but not good enough to declare any of them my lifelong quest or calling.", "But as life goes, I stumbled upon my first “major interest,” and perhaps “talent,” while working as a construction worker at a distribution company. As it happened, the company was going through a major restructuring, and they needed a translator for the meetings among its major players, and I ended up being their temporary translator for those meetings. And boy, were those meetings long. They dragged on all day, but surprisingly, I wasn’t bored at all. I was captivated by the business world, and it called to me, whispering, “You are my biggest fan.” The company’s major stakeholders took notice of me, and that marked the start of my business career and interest.", "From that point on, I worked in all kinds of businesses and companies, from secretary and marketing manager to starting (and failing) a startup, and even serving as CEO of a small company, albeit briefly. All these experiences have deepened my interest and passion for business, and my quest to understand and master the world of entrepreneurship.", "My second “major interest” started in the midst of Covid. I was hitting rock bottom at the time: isolated from the world, lost in my direction in life, and depressed. That’s when I found the great world of YouTube. And what a world it was! I never ceased to be amazed by the countless talented people and their perspectives and worldviews. It opened up a whole other part of life that I had never experienced personally. The podcast space was my favorite, with shows like Joe Rogan, Chris Williamson, Diary of a CEO, The Bible Project Podcast, and many more. And the more I watched, the more I felt I had my own small world worth sharing.", "That interest never died off. Most of the “interests” I thought were my “destiny” never lasted beyond a few months, but this was different. It kept calling me, beckoning me to do something about it. I finally bought a camera, a Sony A7C, but simply buying a nice mirrorless camera didn’t make me a YouTuber. It was years after the purchase, and after many failed attempts, that I decided to go all in and start this podcast, a lifelong dream of mine.", "My last but not least “major interest” is Christianity. My faith was inherited from my parents; there’s no denying that. But my interest and passion for Christianity have kept growing throughout my life. It has faced its fair share of ups and downs, and ups again. But it never left me, and now more than ever, my true desire is to know God and to share the message of love and hope with the world. If everything in my life crumbles and burns to ashes, I know and trust that the only thing left standing will be my faith in Christ.", "So there. That’s my story. So far. & To be continued..."]};
